  services:
    postgres:
      image: postgres:17
      container_name: codereview-postgres
      restart: unless-stopped
      environment:
        POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
        POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5

    pgadmin:
      image: dpage/pgadmin4:latest
      container_name: codereview-pgadmin
      restart: unless-stopped
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Defina PGADMIN_DEFAULT_EMAIL no .env}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Defina PGADMIN_DEFAULT_PASSWORD no .env}
      ports:
        - "5050:80"
      depends_on:
        postgres:
          condition: service_healthy

    api:
      build:
        context: .
        dockerfile: Dockerfile
      container_name: codereview-api
      restart: unless-stopped
      environment:
        DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
        DB_USERNAME: ${POSTGRES_USER}
        DB_PASSWORD: ${POSTGRES_PASSWORD}
        JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
        APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
        APP_BOOTSTRAP_ADMIN_NAME: ${APP_BOOTSTRAP_ADMIN_NAME:-}
        APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
        APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      ports:
        - "8080:8080"
      depends_on:
        postgres:
          condition: service_healthy

  volumes:
    postgres_data: