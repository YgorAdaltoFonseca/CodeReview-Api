  name: CI - CodeReview API

  on:
    push:
      branches:
        - develop
        - release
        - main
        - 'feature/**'

    pull_request:
      branches:
        - develop
        - release
        - main

  permissions:
    contents: read

  jobs:
    build-and-test:
      name: Build and Test
      runs-on: ubuntu-latest

      services:
        postgres:
          image: postgres:17
          env:
            POSTGRES_DB: codereview
            POSTGRES_USER: codereview_user
            POSTGRES_PASSWORD: codereview_test_password
          ports:
            - 5432:5432
          options: >-
            --health-cmd "pg_isready -U codereview_user -d codereview"
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      env:
        DB_URL: jdbc:postgresql://localhost:5432/codereview
        DB_USERNAME: codereview_user
        DB_PASSWORD: codereview_test_password
        JWT_SECRET: VGhpc0lzQVNlY3JldEtleUZvclRlc3RzMTIzNDU2Nzg5MA==

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: temurin
            cache: maven

        - name: Grant execute permission to Maven Wrapper
          run: chmod +x mvnw

        - name: Build and run tests
          run: ./mvnw -B -e -DtrimStackTrace=false clean verify

        - name: Upload test reports
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: test-reports
            path: |
              target/surefire-reports/**
              target/failsafe-reports/**
            if-no-files-found: ignore
            retention-days: 7

        - name: Upload application JAR
          if: success()
          uses: actions/upload-artifact@v4
          with:
            name: codereview-api-jar
            path: target/*.jar
            if-no-files-found: error
            retention-days: 7

    docker-build:
      name: Validate Docker Image
      runs-on: ubuntu-latest
      needs: build-and-test

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Build Docker image
          run: docker build --progress=plain -t codereview-api:ci .